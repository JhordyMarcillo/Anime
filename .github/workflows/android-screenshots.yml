name: Android screenshots

on:
  push:
    branches: [ "claude/anime-api-jn1oef" ]
    paths: [ ".github/workflows/android-screenshots.yml", "android/ci/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Media de prueba + servidor
        run: |
          sudo apt-get install -y -q ffmpeg jq >/dev/null
          mkdir -p demo/Frieren "demo/Cowboy Bebop"
          mk() { ffmpeg -nostdin -v error -y -f lavfi -i "$2" -f lavfi -i "sine=f=$3:d=40" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$1"; }
          mk "demo/Frieren/Frieren - 01.mp4" "testsrc2=d=40:s=640x360:r=24" 440
          mk "demo/Frieren/Frieren - 02.mp4" "smptebars=d=40:s=640x360:r=24" 520
          ffmpeg -nostdin -v error -y -i "demo/Frieren/Frieren - 02.mp4" -c copy "demo/Frieren/Frieren - 02.mkv" && rm "demo/Frieren/Frieren - 02.mp4"
          mk "demo/Cowboy Bebop/Cowboy Bebop S01E01.mp4" "mandelbrot=s=640x360:r=24" 600
          printf '1\n00:00:01,000 --> 00:00:30,000\nHola, este es un subtitulo de prueba\n\n' > "demo/Frieren/Frieren - 01.es.srt"
          MEDIA_DIR=$PWD/demo HOST=0.0.0.0 AUTH_USER=demo AUTH_PASS=demo1234 nohup node server.js > server.log 2>&1 &
          disown
          sleep 3; curl -s -u demo:demo1234 localhost:8000/api/library | jq -c '.[].title'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador de TV y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: docs/android-screenshots

      - name: Guardar capturas en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-screenshots
          git commit -m "Android emulator screenshots [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
